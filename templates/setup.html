<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup - FulMen Agent Network</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f23;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .setup-card {
            background: #1a1a2e;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 40px;
            width: 420px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        .setup-card h1 {
            font-size: 1.5em;
            margin-bottom: 4px;
            color: #7c83ff;
        }
        .setup-card .subtitle {
            font-size: 0.85em;
            color: #888;
            margin-bottom: 8px;
        }
        .setup-card .welcome {
            font-size: 0.95em;
            color: #aaa;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .setup-card label {
            display: block;
            text-align: left;
            font-size: 0.9em;
            color: #aaa;
            margin-bottom: 4px;
            margin-top: 14px;
        }
        .setup-card input[type="text"],
        .setup-card input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #444;
            border-radius: 8px;
            background: #16213e;
            color: #e0e0e0;
            font-size: 1em;
            outline: none;
        }
        .setup-card input:focus {
            border-color: #7c83ff;
        }
        .setup-card button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #7c83ff;
            color: #fff;
            font-size: 1em;
            cursor: pointer;
            font-weight: 600;
            margin-top: 20px;
        }
        .setup-card button:hover {
            background: #6a71e0;
        }
        .error {
            color: #e74c3c;
            font-size: 0.9em;
            margin-top: 12px;
        }
    </style>
</head>
<body>
    <div class="setup-card">
        <h1>FulMen Agent Network</h1>
        <p class="subtitle">Initial Setup</p>
        <p class="welcome">Welcome! Create your admin account to get started. This will be used to log into the dashboard.</p>
        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}
        <form method="POST" action="/setup">
            <label for="username">Username</label>
            <input type="text" name="username" id="username" placeholder="Choose a username" autofocus required>
            <label for="password">Password</label>
            <input type="password" name="password" id="password" placeholder="Choose a password" required>
            <label for="confirm_password">Confirm Password</label>
            <input type="password" name="confirm_password" id="confirm_password" placeholder="Re-enter password" required>
            <button type="submit">Create Account & Enter Dashboard</button>
        </form>
    </div>
</body>
</html>
