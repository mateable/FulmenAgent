<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FulMen Agent Network</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f23;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .login-card {
            background: #1a1a2e;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 40px;
            width: 380px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        .login-card h1 {
            font-size: 1.5em;
            margin-bottom: 6px;
            color: #7c83ff;
        }
        .login-card .subtitle {
            font-size: 0.85em;
            color: #888;
            margin-bottom: 28px;
        }
        .login-card label {
            display: block;
            text-align: left;
            font-size: 0.9em;
            color: #aaa;
            margin-bottom: 4px;
            margin-top: 12px;
        }
        .login-card label:first-of-type { margin-top: 0; }
        .login-card input[type="text"],
        .login-card input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #444;
            border-radius: 8px;
            background: #16213e;
            color: #e0e0e0;
            font-size: 1em;
            outline: none;
        }
        .login-card input:focus {
            border-color: #7c83ff;
        }
        .login-card button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #7c83ff;
            color: #fff;
            font-size: 1em;
            cursor: pointer;
            font-weight: 600;
            margin-top: 20px;
        }
        .login-card button:hover {
            background: #6a71e0;
        }
        .error {
            color: #e74c3c;
            font-size: 0.9em;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>FulMen Agent Network</h1>
        <p class="subtitle">Sign in to access the dashboard</p>
        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}
        <form method="POST" action="/login">
            <label for="username">Username</label>
            <input type="text" name="username" id="username" placeholder="Username" autofocus required>
            <label for="password">Password</label>
            <input type="password" name="password" id="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
